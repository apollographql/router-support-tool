name: "router-diagnostics"
version: "0.1.0"
usage: "helm router-diagnostics collect"
description: |
  Collects a router-diagnostics support bundle for mode: local. Resolves the
  router's Service from the installed router-diagnostics release, bridges its
  metrics port with a temporary kubectl port-forward, then runs the pinned
  support-bundle binary against the cluster's discoverable specs.
command: "$HELM_PLUGIN_DIR/scripts/collect.sh"
hooks:
  install: "$HELM_PLUGIN_DIR/scripts/install-binary.sh"
  update: "$HELM_PLUGIN_DIR/scripts/install-binary.sh"
