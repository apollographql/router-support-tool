name: Router support tool verification
description: >
  Verification plan from specs/verification_plan.md: deploys a router, runs
  router-diagnostics-chart in job mode against it, and retrieves the resulting bundle for checks.

matrix:
  variant_names: "${condition}_${router_version}"
  dimensions:
    condition: [healthy, some-metrics-misconfigured, all-metrics-misconfigured, router-recently-restarted]
  compound:
    router_version_and_redaction:
      - router_version: "v2.4.0"
        redaction: base
        router_config_path: data/base-router-config.yaml
        router_config_configmap_path: data/router-config-configmap-base.yaml
        expected_redacted_router_config_path: data/base-expected-redacted-router-config.yaml
      - router_version: "v2.10.1"
        redaction: base
        router_config_path: data/base-router-config.yaml
        router_config_configmap_path: data/router-config-configmap-base.yaml
        expected_redacted_router_config_path: data/base-expected-redacted-router-config.yaml
      - router_version: "v2.13.0"
        redaction: base
        router_config_path: data/base-router-config.yaml
        router_config_configmap_path: data/router-config-configmap-base.yaml
        expected_redacted_router_config_path: data/base-expected-redacted-router-config.yaml
      - router_version: "v2.17.0" # latest Apollo Router release as of 2026-09-15
        redaction: full
        router_config_path: data/redaction-testing-router-config.yaml
        router_config_configmap_path: data/router-config-configmap-full.yaml
        expected_redacted_router_config_path: data/expected-redacted-router-config.yaml

environment:
  inline:
    name: router-env
    description: A router instance plus a mock-backend receiver for the support bundle upload.

    variable_definitions:
      - name: router_version
        description: "The Apollo Router image tag to deploy"
      - name: router_config_path
        description: "Relative path to the router-config fixture this variant deploys. See the compound matrix in test-plan.yaml."

    env_vars:
      ROUTER_VERSION: "{{ router_version }}"

    resources:
      - name: router-manifest.yaml
        kind: relative_path
        path: data/router-manifest.yaml
      - name: mock-backend-manifest.yaml
        kind: relative_path
        path: data/mock-backend-manifest.yaml

    file_providers:
      - name: mock_backend_server.py
        env_var: MOCK_BACKEND_SCRIPT
        kind: relative_path
        path: data/mock_backend_server.py

      - name: router-config.yaml
        env_var: ROUTER_CONFIG
        kind: relative_path
        path: "{{ router_config_path }}"

      - name: supergraph.graphql
        env_var: SUPERGRAPH_SCHEMA
        kind: relative_path
        path: data/supergraph.graphql

      - name: router-config-metrics-disabled.yaml
        env_var: ROUTER_CONFIG_METRICS_DISABLED
        kind: relative_path
        path: data/router-config-metrics-disabled.yaml

      - name: license.jwt
        env_var: LICENSE
        kind: offline_graphos_license
        graph_id: "starstuff"

scenario:
  inline:
    name: run-router-support-tool
    description: Runs env_setup.sh to put the routers into the desired condition, then scenario.sh to install router-diagnostics via helm, run it, retrieve the resulting bundle, and verify its contents.

    variable_definitions:
      - name: condition
        description: "The router condition env_setup.sh should set up before a support bundle is collected."
      - name: router_version
        description: "The Apollo Router image tag deployed - used to assert clusterResources actually captured it."
      - name: redaction
        description: "base or full - which redaction assertions scenario.sh runs for this variant."
      - name: router_config_path
        description: "Relative path to the router-config fixture this variant deploys. See the compound matrix in test-plan.yaml."
      - name: router_config_configmap_path
        description: "Relative path to the router-config ConfigMap manifest this variant applies. See the compound matrix in test-plan.yaml."
      - name: expected_redacted_router_config_path
        description: "Relative path to the fixture this variant's byte-diff check uses. See the compound matrix in test-plan.yaml."

    docker:
      image: us-central1-docker.pkg.dev/platform-cross-environment/apollo-private-docker/rtf-toolbox
      tag: edge
      command: "sh $SCRIPT"

    env_vars:
      CONDITION: "{{ condition }}"
      ROUTER_VERSION: "{{ router_version }}"
      REDACTION: "{{ redaction }}"

    file_providers:
      - name: env_setup.sh
        env_var: ENV_SETUP_SCRIPT
        kind: relative_path
        path: data/env_setup.sh

      - name: scenario.sh
        env_var: SCRIPT
        kind: relative_path
        path: data/scenario.sh

      - name: router-config.yaml
        env_var: ROUTER_CONFIG
        kind: relative_path
        path: "{{ router_config_path }}"

      # The ConfigMap the configMap collector actually captures (decoupled from the router's own
      # boot config, see that file's own header comment).
      - name: router-config-configmap.yaml
        env_var: ROUTER_CONFIG_CONFIGMAP
        kind: relative_path
        path: "{{ router_config_configmap_path }}"

      - name: expected-redacted-router-config.yaml
        env_var: EXPECTED_REDACTED_ROUTER_CONFIG
        kind: relative_path
        path: "{{ expected_redacted_router_config_path }}"

      - name: router-diagnostics-chart
        env_var: CHART_DIR
        kind: relative_dir
        path: ../router-diagnostics-chart
        files:
          - "Chart.yaml"
          - "values.yaml"
          - "templates/_helpers.tpl"
          - "templates/base-spec-configmap.yaml"
          - "templates/job-rbac.yaml"
          - "templates/job-storage-secret.yaml"
          - "templates/job.yaml"
          - "files/collect-and-upload.sh"
