apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multi-release
spec:
  # Exercises specs/collection/base_spec.md's "Each router release in a namespace gets
  # its own file in the support bundle" claim, and specs/collection/meta_json.md's
  # "Multiple router releases in one namespace" note.
  #
  # Two ConfigMaps carrying the standard router label stand in for two separate router
  # releases in the same namespace (one per graph, for example). No router
  # Deployment/Service is needed: the configMap collector matches purely on the label,
  # independent of pod health, so hand-created ConfigMaps exercise the same code path a
  # real second release would - this is the same reasoning the raw-manifest test
  # already relies on for its own single ConfigMap.

  # This test also doesn't install a real router (official-chart and
  # exercises collect.sh with zero Services matching its selector
  # ensuring collect.sh degrades gracefully in this case is also verified here.
  #
  # All paths here are relative to this test's own directory, because that's how
  # Chainsaw resolves them.
  steps:
    - try:
        - script:
            content: |
              kubectl create configmap router-alpha -n "$NAMESPACE" --from-file=router.yaml=router-a.yaml
              kubectl label configmap router-alpha -n "$NAMESPACE" app.kubernetes.io/name=router

              kubectl create configmap router-beta -n "$NAMESPACE" --from-file=router.yaml=router-b.yaml
              kubectl label configmap router-beta -n "$NAMESPACE" app.kubernetes.io/name=router
            env:
              - name: NAMESPACE
                value: ($namespace)
        - script:
            timeout: 120s
            content: |
              ../scripts/verify_multi_release_bundle.sh "$NAMESPACE" \
                ../../../router-diagnostics-chart ../../../router-diagnostics-collect/collect.sh
            env:
              - name: NAMESPACE
                value: ($namespace)
