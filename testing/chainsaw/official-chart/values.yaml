# Values for the *official* apollographql/router Helm chart
# (oci://ghcr.io/apollographql/helm-charts/router), used only to exercise the
# "Official Apollo router Helm chart" deployment tier from
# specs/deployment/v1/v1.md - specifically the APOLLO_GRAPH_REF and
# APOLLO_ROUTER_OFFICIAL_HELM_CHART env vars that only this tier sets.
#
# managedFederation.graphRef is a fake ref with no managedFederation.apiKey - the chart
# only templates the env var value in verbatim (no live validation at render time), and a
# local supergraphFile is provided below so the router boots self-hosted rather than
# attempting real managed federation against Studio.
router:
  configuration:
    supergraph:
      listen: 0.0.0.0:4000
    health_check:
      listen: 0.0.0.0:8088
      enabled: true
    telemetry:
      exporters:
        metrics:
          prometheus:
            enabled: true
            listen: 0.0.0.0:9090
            path: /metrics
      instrumentation:
        events:
          supergraph:
            request: info
            response: info

    # JWT and auth config redaction test, aws_sig_v4 only. JWKS-fetch-headers
    # (authentication.router.jwt) requires a GraphOS Enterprise license, so that's tested
    # via RTF, which has one. "all" carries the hardcoded (secret) variant; the inventory
    # subgraph override carries default_chain, which holds no literal credential and must
    # survive untouched - extraEnvVars below gives it fake env-var credentials so it never
    # needs to reach the real cloud metadata endpoint at boot.
    authentication:
      subgraph:
        all:
          aws_sig_v4:
            hardcoded:
              access_key_id: SENTINEL_AWS_ACCESS_KEY_ID
              secret_access_key: SENTINEL_AWS_SECRET_ACCESS_KEY
              region: us-east-1
              service_name: vpc-lattice-svcs
        subgraphs:
          inventory:
            aws_sig_v4:
              default_chain:
                region: us-east-1
                service_name: vpc-lattice-svcs

    # Header values redaction tests - block style (name/value on
    # separate lines) and flow style (name/value inline), one pair per field. The
    # official chart's own YAML marshaling re-serializes maps alphabetically (unlike
    # raw-manifest's hand-authored router.yaml), so this tier is what actually exercises
    # the block-style redactors' order independence.
    headers:
      all:
        request:
          operations:
            - insert:
                name: x-sentinel-static
                value: SENTINEL_HEADER_INSERT_VALUE
            - insert:
                name: x-sentinel-frombody
                path: "$.doesNotExist"
                default: SENTINEL_HEADER_INSERT_DEFAULT
            - propagate:
                named: x-sentinel-source-header
                default: SENTINEL_HEADER_PROPAGATE_DEFAULT
            - insert: { name: x-sentinel-flow-static, value: SENTINEL_FLOW_INSERT_VALUE }
            - insert: { name: x-sentinel-flow-frombody, path: "$.doesNotExist", default: SENTINEL_FLOW_INSERT_DEFAULT }
            - propagate: { named: x-sentinel-flow-source, default: SENTINEL_FLOW_PROPAGATE_DEFAULT }

    # Subgraph urls redaction tests - two subgraphs, one quoted, one not.
    override_subgraph_url:
      accounts: "https://svc-user:SENTINEL_SUBGRAPH_URL_PASSWORD@accounts.internal.svc.cluster.local:4001/graphql"
      inventory: https://svc-user2:SENTINEL_SUBGRAPH_URL_PASSWORD_2@inventory.internal.svc.cluster.local:4001/graphql

    include_subgraph_errors:
      all: false

    # TLS private keys redaction tests - all three key locations, plus certificate_authorities
    # (public CA material - left visible) on the two client-auth locations.
    # The connector key is a longer RSA key (vs the others' short EC keys) to
    # test that the lazy match across more line wraps.
