# Values for the *official* apollographql/router Helm chart
# (oci://ghcr.io/apollographql/helm-charts/router), used only to exercise the
# "Official Apollo router Helm chart" deployment tier from
# specs/deployment/v1/v1.md - specifically the APOLLO_GRAPH_REF and
# APOLLO_ROUTER_OFFICIAL_HELM_CHART env vars that only this tier sets.
#
# managedFederation.graphRef is a fake ref with no managedFederation.apiKey - the chart
# only templates the env var value in verbatim (no live validation at render time), and a
# local supergraphFile is provided below so the router boots self-hosted rather than
# attempting real managed federation against Studio.
router:
  configuration:
    supergraph:
      listen: 0.0.0.0:4000
    health_check:
      listen: 0.0.0.0:8088
      enabled: true
    telemetry:
      exporters:
        metrics:
          prometheus:
            enabled: true
            listen: 0.0.0.0:9090
            path: /metrics
  args:
    - --hot-reload
    - --supergraph
    - /etc/apollo/supergraph-schema.graphql

managedFederation:
  graphRef: "test-graph@test"

extraVolumes:
  - name: supergraph
    configMap:
      name: router-supergraph

extraVolumeMounts:
  - name: supergraph
    mountPath: /etc/apollo
    readOnly: true

# Set purely so the integration test has a real value to assert clusterResources
# actually captured - generous enough not to constrain the router under test.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
