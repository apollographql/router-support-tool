apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: official-chart
spec:
  # Coverage against specs/collection/base_spec.md's "What the base spec collects" tables
  # deliberately not checked here:
  #   - Previous-container logs (-previous.log) - no restart scenario exists.
  #   - OOM kill occurrences/last state
  #
  # All paths here are relative to this test's own directory, because that's how
  # Chainsaw resolves them.
  #
  # Not concurrency-safe with the raw-manifest test: the router-diagnostics collect
  # script port-forwards to a hardcoded local port (9090) to reach the router's
  # metrics endpoint, and a local TCP port is a single-machine resource regardless of
  # which cluster/namespace either test targets.
  concurrent: false
  steps:
    - try:
        - script:
            timeout: 120s
            content: |
              helm install router oci://ghcr.io/apollographql/helm-charts/router \
                --version 2.17.0 \
                -n "$NAMESPACE" \
                --values values.yaml \
                --set-file supergraphFile=../../fixtures/supergraph.graphql

              # The router-diagnostics collect script port-forwards to the
              # router's Service (not the pod directly) to reach :9090/metrics under
              # mode: local. This chart only adds that port to the Service when
              # serviceMonitor.enabled is true, which also renders an actual
              # ServiceMonitor CRD object - unavailable on a stock kind cluster. Patch
              # the port on directly instead, so we don't need the prometheus-operator
              # CRDs installed just for this.
              kubectl patch service router -n "$NAMESPACE" --type=json \
                -p='[{"op": "add", "path": "/spec/ports/-", "value": {"name": "metrics", "port": 9090, "targetPort": 9090, "protocol": "TCP"}}]'
            env:
              - name: NAMESPACE
                value: ($namespace)
        - assert:
            timeout: 90s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: router
              status:
                (conditions[?type == 'Available']):
                - status: "True"
        # Operation bodies redaction testing - values.yaml's router.configuration enables
        # telemetry.instrumentation.events.supergraph.{request,response} which logs the raw
        # request/response body. This mutation carries a sentinel in a variable and an
        # escaped quote in a string literalvto exercise the redactor's JSON-escaping-aware
        # regex.
        - script:
            # kubectl run has to schedule a pod and pull curlimages/curl
            # which can take a while on a cold/uncached node.
            timeout: 60s
            content: |
              # The official chart's Service maps port 80 to the
              # container's "http" port (4000), unlike raw-manifest's Service which
              # exposes 4000 directly.
              # --retry-connrefused: Available only guarantees the readinessProbe target
              # responded, not that the GraphQL listener socket is bound yet - same class
              # of race as the metrics port (see wait_for_metrics.sh).
              kubectl run curl-sentinel --image=curlimages/curl:8.10.1 --rm -i --restart=Never -n "$NAMESPACE" -- \
                curl -sk --retry 5 --retry-delay 2 --retry-connrefused -X POST "https://router.$NAMESPACE.svc.cluster.local:80/" \
                -H "Content-Type: application/json" \
                -d '{"query":"mutation InsertSentinel($sentinelId: ID!) { createProduct(upc: $sentinelId, name: \"SENTINEL_QUOTE_\\\"TEST\\\"\") { upc } }","variables":{"sentinelId":"SENTINEL_OPERATION_BODY_VALUE"}}'
            env:
              - name: NAMESPACE
                value: ($namespace)
        # Available only guarantees the chart's own readinessProbe target
        # (health_check, :8088) is responding, not the prometheus exporter
        # (:9090) - those can start a beat apart, especially under a slow/cold
        # CI runner. Poll :9090/metrics directly rather than assuming Available
        # implies it's already serving.
        - script:
            # Probe pod startup (up to 60s) + up to 40 retries at 3s apiece
            timeout: 210s
            content: |
              ../scripts/wait_for_metrics.sh "$NAMESPACE"
            env:
              - name: NAMESPACE
                value: ($namespace)
        # kubelet's per-container PSI/pageFault stats (nodeMetrics collector,
        # KubeletPSI feature gate) need a stats-collection cycle to populate for a
        # container this fresh - without this, collection can run before they exist.
        - sleep:
            duration: 15s
        - script:
            timeout: 120s
            content: |
              ../scripts/verify_official_chart_bundle.sh "$NAMESPACE" \
                ../../../router-diagnostics-chart ../../../router-diagnostics-collect/collect.sh \
                "test-graph@test"
            env:
              - name: NAMESPACE
                value: ($namespace)
