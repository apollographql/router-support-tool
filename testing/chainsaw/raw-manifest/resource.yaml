# Router deployment for CI to collect against
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app.kubernetes.io/name: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
    spec:
      containers:
        - name: router
          # renovate: datasource=github-releases depName=apollographql/router
          image: ghcr.io/apollographql/router:v2.16.3
          # Set purely so the integration test has a real value to assert clusterResources
          # actually captured.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          args:
            - "--config"
            - "/etc/router/router.yaml"
            - "--supergraph"
            - "/etc/router/supergraph.graphql"
          # aws_sig_v4's default_chain (specs/collection/data_sanitization/jwt_and_auth_config.md)
          # needs at least one credential source configured or the router refuses to
          # boot at all ("the credential provider was not enabled") - AWS_EC2_METADATA_DISABLED
          # alone removes the only one available here, which is worse. These fake
          # env-var credentials satisfy the AWS SDK's credential chain without it ever
          # touching a network - AWS_REGION additionally skips the SDK's separate IMDS
          # region lookup, which otherwise hangs against a real cloud runner's actual
          # metadata endpoint (only refused instantly on a bare Docker network) and
          # pushed rollout past its timeout.
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "AKIAIOSFODNN7TESTING"
            - name: AWS_SECRET_ACCESS_KEY
              value: "wJalrXUtnFEMItesting123fakekey"
            - name: AWS_REGION
              value: "us-east-1"
            - name: APOLLO_KEY
              value: "service:sentinel-test-graph:SENTINELAPOLLOKEYTESTING123:withcolon"
            - name: REDIS_URL
              value: "redis://redisuser:SENTINELREDISPODENVPASSWORD@redis.internal:6379/0"
          ports:
            - containerPort: 4000
            - containerPort: 9091
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 2
          volumeMounts:
            - name: router-config
              mountPath: /etc/router
      volumes:
        - name: router-config
          configMap:
            name: router-config
---
apiVersion: v1
kind: Service
metadata:
  name: router
  labels:
    app.kubernetes.io/name: router
spec:
  selector:
    app.kubernetes.io/name: router
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
    - name: graphql
      port: 4000
      targetPort: 4000
