apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: raw-manifest
spec:
  # Coverage against specs/collection/base_spec.md's "What the base spec collects" tables
  # deliberately not checked here:
  #   - APOLLO_GRAPH_REF/APOLLO_ROUTER_OFFICIAL_HELM_CHART env vars - resource.yaml doesn't
  #     set them (this isn't the official router Helm chart).
  #   - Previous-container logs (-previous.log) - no restart scenario exists.
  #   - OOM kill occurrences/last state
  #
  # resource.yaml labels the router app.kubernetes.io/name=router, the chart's own
  # default selector, so this test only exercises values.yaml's selector left unset.
  # The custom-selector override path (--set selector=...) is covered by RTF's
  # scenario.sh, which deliberately uses a non-default app=router label.
  #
  # All paths here are relative to this test's own directory
  # because that's how Chainsaw resolves them.
  #
  # Not concurrency-safe with the official-chart test: router-diagnostics-helm-plugin's
  # collect.sh port-forwards to a hardcoded local port (9090) to reach the router's
  # metrics endpoint, and a local TCP port is a single-machine resource regardless of
  # which cluster/namespace either test targets.
  concurrent: false
  steps:
    - try:
        - script:
            content: |
              kubectl create configmap router-config -n "$NAMESPACE" \
                --from-file=router.yaml=router.yaml \
                --from-file=supergraph.graphql=../../fixtures/supergraph.graphql
              kubectl label configmap router-config -n "$NAMESPACE" app.kubernetes.io/name=router
            env:
              - name: NAMESPACE
                value: ($namespace)
        - apply:
            file: resource.yaml
        - assert:
            timeout: 90s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: router
              status:
                (conditions[?type == 'Available']):
                - status: "True"
        # Operation bodies redaction testing - router.yaml enables
        # telemetry.instrumentation.events.supergraph.{request,response} which logs the raw
        # request/response body. This mutation carries a sentinel in a variable and an
        # escaped quote in a string literal to exercise the redactor's JSON-escaping-aware
        # regex.
        - script:
            # kubectl run has to schedule a pod and pull curlimages/curl
            # which can take a while on a cold/uncached node.
            timeout: 60s
            content: |
              # --retry-connrefused: Available only guarantees the readinessProbe target
              # responded, not that the GraphQL listener socket is bound yet - same class
              # of race as the metrics port (see wait_for_metrics.sh).
              kubectl run curl-sentinel --image=curlimages/curl:8.10.1 --rm -i --restart=Never -n "$NAMESPACE" -- \
                curl -sk --retry 5 --retry-delay 2 --retry-connrefused -X POST "https://router.$NAMESPACE.svc.cluster.local:4000/" \
                -H "Content-Type: application/json" \
                -d '{"query":"mutation InsertSentinel($sentinelId: ID!) { createProduct(upc: $sentinelId, name: \"SENTINEL_QUOTE_\\\"TEST\\\"\") { upc } }","variables":{"sentinelId":"SENTINEL_OPERATION_BODY_VALUE"}}'
            env:
              - name: NAMESPACE
                value: ($namespace)
        # kubelet's per-container PSI/pageFault stats (nodeMetrics collector,
        # KubeletPSI feature gate) need a stats-collection cycle to populate for a
        # container this fresh - without this, collection can run before they exist.
        - sleep:
            duration: 15s
        - script:
            timeout: 120s
            content: |
              ../scripts/verify_raw_manifest_bundle.sh "$NAMESPACE" resource.yaml \
                ../../../router-diagnostics-chart ../../../router-diagnostics-helm-plugin
            env:
              - name: NAMESPACE
                value: ($namespace)
