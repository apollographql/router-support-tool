# This ConfigMap is not mounted anywhere and has no effect on the running router, it exists
# solely as a target for the router-support-tool's own configMap collector to discover and
# collect during this test and for us to test custom redaction.
# The router itself is actually configured via file_providers (see base-router-config.yaml,
# which this ConfigMap's router.yaml key must stay in sync with byte-for-byte).
apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  labels:
    app: router
data:
  router.yaml: |
    supergraph:
      listen: 0.0.0.0:4000

    health_check:
      listen: 0.0.0.0:8088
      enabled: true

    telemetry:
      exporters:
        metrics:
          prometheus:
            enabled: true
            listen: 0.0.0.0:9090
            path: /metrics
      instrumentation:
        events:
          supergraph:
            request: info
            response: info

    apq:
      router:
        cache:
          redis:
            urls:
              - "redis://localhost:6391"
            username: SENTINEL_REDIS_USERNAME
            password: SENTINEL_REDIS_PASSWORD
            required_to_start: false

    authentication:
      router:
        jwt:
          jwks:
            - url: http://localhost:9090/jwks-not-found
              issuers:
                - "https://issuer.example.com"
              algorithms:
                - RS256
              headers:
                - name: x-vault-token
                  value: "SENTINEL_JWKS_HEADER_VALUE"
      subgraph:
        all:
          aws_sig_v4:
            hardcoded:
              access_key_id: SENTINEL_AWS_ACCESS_KEY_ID
              secret_access_key: SENTINEL_AWS_SECRET_ACCESS_KEY
              region: us-east-1
              service_name: vpc-lattice-svcs

