supergraph:
  listen: 0.0.0.0:4000
  # Tests specs/collection/data_sanitization/redis_credentials.md - URL-embedded credentials
  # plus two more shapes as comments. These are commented out because the router's
  # Redis client rejects a `urls` list with inconsistent usernames across entries, and
  # rejects combining URL-embedded creds with explicit username/password on one cache.
  # Redaction is plain text matching, so a commented-out line is still good data
  # for the redactor even though the router itself never parses it.
  # Pathless form (no username, a normal pre-ACL Redis idiom):
  #   - "redis://***HIDDEN***@localhost:6392"
  # Separate username/password fields, quoted (apq's below are the unquoted form):
  #   username: "***HIDDEN***"
  #   password: "***HIDDEN***"
  query_planning:
    cache:
      redis:
        urls:
          - "redis://***HIDDEN***@localhost:6390"
        required_to_start: false

health_check:
  listen: 0.0.0.0:8088
  enabled: true

telemetry:
  exporters:
    metrics:
      prometheus:
        enabled: true
        listen: 0.0.0.0:9090
        path: /metrics
  # specs/collection/data_sanitization/operation_bodies.md
  instrumentation:
    events:
      supergraph:
        request: info
        response: info

# Tests specs/collection/data_sanitization/redis_credentials.md,
# username/password as separate fields
apq:
  router:
    cache:
      redis:
        urls:
          - "redis://localhost:6391"
        username: ***HIDDEN***
        password: ***HIDDEN***
        required_to_start: false

authentication:
  router:
    jwt:
      jwks:
        # Block-style headers (mask every entry), a quoted value, and issuers/algorithms
        # to confirm non-secret JWKS fields survive redaction untouched.
        - url: http://localhost:9090/jwks-not-found
          issuers:
            - "https://issuer.example.com"
          algorithms:
            - RS256
          headers:
            - name: x-vault-token
              value: "***HIDDEN***"
        # Single-entry flow-style headers
        - url: http://localhost:9090/jwks-not-found-flow
          headers: [{ name: x-api-key-flow, value: ***HIDDEN***}]
        # Two-entry flow-style headers, both values must be masked
        - url: http://localhost:9090/jwks-not-found-flow-multi
          headers: [{ name: x-flow-multi-a, value: ***HIDDEN***}, { name: x-flow-multi-b, value: ***HIDDEN***}]
  subgraph:
    all:
      aws_sig_v4:
        hardcoded:
          access_key_id: ***HIDDEN***
          secret_access_key: ***HIDDEN***
          region: us-east-1
          service_name: vpc-lattice-svcs

# Tests specs/collection/data_sanitization/header_values.md
headers:
  all:
    request:
      operations:
        - insert:
            name: x-sentinel-static
            value: ***HIDDEN***
        - insert:
            name: x-sentinel-frombody
            path: "$.doesNotExist"
            default: ***HIDDEN***
        - propagate:
            named: x-sentinel-source-header
            default: ***HIDDEN***

