# Used for every router_version except v2.17.0 in the RTF test plan's matrix.
# redaction-testing-router-config.yaml exhaustively exercises every redaction rule, but its schema
# isn't stable across the whole router_version range. For example, headers.all.request's shape
# changed between v2.4.0 and v2.17.0 with no syntax valid on both (confirmed via
# `router config validate`), so header redaction is the one category this file can't cover.
# Every other category is covered, with a config confirmed schema-valid on v2.4.0, v2.10.1,
# v2.13.0, and v2.17.0.
supergraph:
  listen: 0.0.0.0:4000

health_check:
  listen: 0.0.0.0:8088
  enabled: true

telemetry:
  exporters:
    metrics:
      prometheus:
        enabled: true
        listen: 0.0.0.0:9090
        path: /metrics
  # specs/collection/data_sanitization/operation_bodies.md - the sentinel operation sent
  # by scenario.sh's curl call is what this actually logs.
  instrumentation:
    events:
      supergraph:
        request: info
        response: info

# Tests specs/collection/data_sanitization/redis_credentials.md's username/password
# field shape.
apq:
  router:
    cache:
      redis:
        urls:
          - "redis://localhost:6391"
        username: SENTINEL_REDIS_USERNAME
        password: SENTINEL_REDIS_PASSWORD
        required_to_start: false

# Tests specs/collection/data_sanitization/jwt_and_auth_config.md's JWKS header case,
# and aws_sig_v4's hardcoded case.
authentication:
  router:
    jwt:
      jwks:
        - url: http://localhost:9090/jwks-not-found
          issuers:
            - "https://issuer.example.com"
          algorithms:
            - RS256
          headers:
            - name: x-vault-token
              value: "SENTINEL_JWKS_HEADER_VALUE"
  subgraph:
    all:
      aws_sig_v4:
        hardcoded:
          access_key_id: SENTINEL_AWS_ACCESS_KEY_ID
          secret_access_key: SENTINEL_AWS_SECRET_ACCESS_KEY
          region: us-east-1
          service_name: vpc-lattice-svcs

