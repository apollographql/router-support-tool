supergraph:
  listen: 0.0.0.0:4000

health_check:
  listen: 0.0.0.0:8088
  enabled: true

telemetry:
  exporters:
    metrics:
      prometheus:
        enabled: true
        listen: 0.0.0.0:9090
        path: /metrics
  instrumentation:
    events:
      supergraph:
        request: info
        response: info

apq:
  router:
    cache:
      redis:
        urls:
          - "redis://localhost:6391"
        username: ***HIDDEN***
        password: ***HIDDEN***
        required_to_start: false

authentication:
  router:
    jwt:
      jwks:
        - url: http://localhost:9090/jwks-not-found
          issuers:
            - "https://issuer.example.com"
          algorithms:
            - RS256
          headers:
            - name: x-vault-token
              value: "***HIDDEN***"
  subgraph:
    all:
      aws_sig_v4:
        hardcoded:
          access_key_id: ***HIDDEN***
          secret_access_key: ***HIDDEN***
          region: us-east-1
          service_name: vpc-lattice-svcs

