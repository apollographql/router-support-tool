apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-backend
  labels:
    app: mock-backend
  annotations:
    rtf.io/file-providers: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-backend
  template:
    metadata:
      labels:
        app: mock-backend
    spec:
      containers:
        - name: mock-backend
          image: python:3.14-slim
          command: ["python3", "${MOCK_BACKEND_SCRIPT}"]
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mock-backend
  labels:
    app: mock-backend
spec:
  selector:
    app: mock-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
