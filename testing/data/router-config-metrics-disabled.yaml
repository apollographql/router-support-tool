supergraph:
  listen: 0.0.0.0:4000

health_check:
  listen: 0.0.0.0:8088
  enabled: true

telemetry:
  exporters:
    metrics:
      prometheus:
        enabled: false
        listen: 0.0.0.0:9090
        path: /metrics

# Must match base-router-config.yaml's tls.supergraph block. This file is swapped in over
# a running router's config to disable Prometheus only - without this, misconfigure_metrics
# (env_setup.sh) also drops TLS as a side effect, and scenario.sh's https:// sentinel curl
# then fails with a TLS handshake error instead of exercising metrics.
