supergraph:
  listen: 0.0.0.0:4000
  # Tests specs/collection/data_sanitization/redis_credentials.md - URL-embedded credentials
  # plus two more shapes as comments. These are commented out because the router's
  # Redis client rejects a `urls` list with inconsistent usernames across entries, and
  # rejects combining URL-embedded creds with explicit username/password on one cache.
  # Redaction is plain text matching, so a commented-out line is still good data
  # for the redactor even though the router itself never parses it.
  # Pathless form (no username, a normal pre-ACL Redis idiom):
  #   - "redis://:SENTINEL_REDIS_PATHLESS_PASSWORD@localhost:6392"
  # Separate username/password fields, quoted (apq's below are the unquoted form):
  #   username: "SENTINEL_REDIS_USERNAME_QUOTED"
  #   password: "SENTINEL_REDIS_PASSWORD_QUOTED"
  query_planning:
    cache:
      redis:
        urls:
          - "redis://redisuser:SENTINEL_REDIS_URL_PASSWORD@localhost:6390"
        required_to_start: false

health_check:
  listen: 0.0.0.0:8088
  enabled: true

telemetry:
  exporters:
    metrics:
      prometheus:
        enabled: true
        listen: 0.0.0.0:9090
        path: /metrics
  # specs/collection/data_sanitization/operation_bodies.md
  instrumentation:
    events:
      supergraph:
        request: info
        response: info

# Tests specs/collection/data_sanitization/redis_credentials.md,
# username/password as separate fields
apq:
  router:
    cache:
      redis:
        urls:
          - "redis://localhost:6391"
        username: SENTINEL_REDIS_USERNAME
        password: SENTINEL_REDIS_PASSWORD
        required_to_start: false

# Tests specs/collection/data_sanitization/header_values.md
headers:
  all:
    request:
      operations:
        - insert:
            name: x-sentinel-static
            value: SENTINEL_HEADER_INSERT_VALUE
        - insert:
            name: x-sentinel-frombody
            path: "$.doesNotExist"
            default: SENTINEL_HEADER_INSERT_DEFAULT
        - propagate:
            named: x-sentinel-source-header
            default: SENTINEL_HEADER_PROPAGATE_DEFAULT

