# This ConfigMap is not mounted anywhere and has no effect on the running router - it exists
# solely as a target for the router-support-tool's own configMap collector to discover and
# collect during this test. The router itself is actually configured via file_providers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  labels:
    app: router
data:
  router.yaml: |
    supergraph:
      listen: 0.0.0.0:4000

    health_check:
      listen: 0.0.0.0:8088
      enabled: true

    telemetry:
      exporters:
        metrics:
          prometheus:
            enabled: true
            listen: 0.0.0.0:9090
            path: /metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app: router
  annotations:
    rtf.io/log-collection: "true"
    rtf.io/file-providers: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      containers:
        - name: router
          image: "ghcr.io/apollographql/router:${ROUTER_VERSION}"
          imagePullPolicy: IfNotPresent
          args:
            - "-s"
            - "${SUPERGRAPH_SCHEMA}"
            - "-c"
            - "${ROUTER_CONFIG}"
            - "--hot-reload"
            - "--license"
            - "${LICENSE}"
          ports:
            - name: graphql
              containerPort: 4000
            - name: health
              containerPort: 8088
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health?ready
              port: 8088
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health?live
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: router
  labels:
    app: router
spec:
  selector:
    app: router
  ports:
    - name: graphql
      port: 4000
      targetPort: 4000
    - name: metrics
      port: 9090
      targetPort: 9090
