# This ConfigMap is not mounted anywhere and has no effect on the running router, it exists
# solely as a target for the router-support-tool's own configMap collector to discover and
# collect during this test and for us to test custom redaction.
# The router itself is actually configured via file_providers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  labels:
    app: router
data:
  router.yaml: |
    supergraph:
      listen: 0.0.0.0:4000
      # Tests specs/collection/data_sanitization/redis_credentials.md - URL-embedded credentials
      # plus two more shapes as comments. These are commented out because the router's
      # Redis client rejects a `urls` list with inconsistent usernames across entries, and
      # rejects combining URL-embedded creds with explicit username/password on one cache.
      # Redaction is plain text matching, so a commented-out line is still good data
      # for the redactor even though the router itself never parses it.
      # Pathless form (no username, a normal pre-ACL Redis idiom):
      #   - "redis://:SENTINEL_REDIS_PATHLESS_PASSWORD@localhost:6392"
      # Separate username/password fields, quoted (apq's below are the unquoted form):
      #   username: "SENTINEL_REDIS_USERNAME_QUOTED"
      #   password: "SENTINEL_REDIS_PASSWORD_QUOTED"
      query_planning:
        cache:
          redis:
            urls:
              - "redis://redisuser:SENTINEL_REDIS_URL_PASSWORD@localhost:6390"
            required_to_start: false

    health_check:
      listen: 0.0.0.0:8088
      enabled: true

    telemetry:
      exporters:
        metrics:
          prometheus:
            enabled: true
            listen: 0.0.0.0:9090
            path: /metrics
      # specs/collection/data_sanitization/operation_bodies.md
      instrumentation:
        events:
          supergraph:
            request: info
            response: info

    # Tests specs/collection/data_sanitization/redis_credentials.md,
    # username/password as separate fields
    apq:
      router:
        cache:
          redis:
            urls:
              - "redis://localhost:6391"
            username: SENTINEL_REDIS_USERNAME
            password: SENTINEL_REDIS_PASSWORD
            required_to_start: false

    authentication:
      router:
        jwt:
          jwks:
            # Block-style headers (mask every entry), a quoted value, and issuers/algorithms
            # to confirm non-secret JWKS fields survive redaction untouched.
            - url: http://localhost:9090/jwks-not-found
              issuers:
                - "https://issuer.example.com"
              algorithms:
                - RS256
              headers:
                - name: x-vault-token
                  value: "SENTINEL_JWKS_HEADER_VALUE"
            # Single-entry flow-style headers
            - url: http://localhost:9090/jwks-not-found-flow
              headers: [{ name: x-api-key-flow, value: SENTINEL_JWKS_FLOW_HEADER_SINGLE }]
            # Two-entry flow-style headers, both values must be masked
            - url: http://localhost:9090/jwks-not-found-flow-multi
              headers: [{ name: x-flow-multi-a, value: SENTINEL_JWKS_FLOW_MULTI_FIRST }, { name: x-flow-multi-b, value: SENTINEL_JWKS_FLOW_MULTI_SECOND }]
      subgraph:
        all:
          aws_sig_v4:
            hardcoded:
              access_key_id: SENTINEL_AWS_ACCESS_KEY_ID
              secret_access_key: SENTINEL_AWS_SECRET_ACCESS_KEY
              region: us-east-1
              service_name: vpc-lattice-svcs

    # Tests specs/collection/data_sanitization/header_values.md
    headers:
      all:
        request:
          operations:
            - insert:
                name: x-sentinel-static
                value: SENTINEL_HEADER_INSERT_VALUE
            - insert:
                name: x-sentinel-frombody
                path: "$.doesNotExist"
                default: SENTINEL_HEADER_INSERT_DEFAULT
            - propagate:
                named: x-sentinel-source-header
                default: SENTINEL_HEADER_PROPAGATE_DEFAULT

    # Tests specs/collection/data_sanitization/subgraph_urls.md
    override_subgraph_url:
      accounts: "https://svc-user:SENTINEL_SUBGRAPH_URL_PASSWORD@accounts.internal.svc.cluster.local:4001/graphql"

    # Tests specs/collection/data_sanitization/tls_private_keys.md
    tls:
