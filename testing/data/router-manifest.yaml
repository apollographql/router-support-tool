apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app: router
  annotations:
    rtf.io/log-collection: "true"
    rtf.io/file-providers: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
      annotations:
        # We set these so env_setup.sh can read the resolved
        # file_providers paths straight off the pod
        router-config-path: "${ROUTER_CONFIG}"
        router-config-degraded-path: "${ROUTER_CONFIG_METRICS_DISABLED}"
    spec:
      containers:
        - name: router
          image: "ghcr.io/apollographql/router:${ROUTER_VERSION}"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          args:
            - "-s"
            - "${SUPERGRAPH_SCHEMA}"
            - "-c"
            - "${ROUTER_CONFIG}"
            - "--hot-reload"
            - "--license"
            - "${LICENSE}"
          ports:
            - name: graphql
              containerPort: 4000
            - name: health
              containerPort: 8088
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health?ready
              port: 8088
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health?live
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: router
  labels:
    app: router
spec:
  selector:
    app: router
  ports:
    - name: graphql
      port: 4000
      targetPort: 4000
    - name: metrics
      port: 9090
      targetPort: 9090
