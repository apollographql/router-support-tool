# Only rendered when a static job.storage.s3/gcs credential is set directly as a chart value.
# This holds the same keys an existingSecret would need, so job.yaml mounts this to a customer-supplied Secret.
{{- if and (eq .Values.mode "job") .Values.job.storage.provider (not .Values.job.storage.existingSecret) }}
{{- if and (eq .Values.job.storage.provider "s3") .Values.job.storage.s3.accessKeyId .Values.job.storage.s3.secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: router-diagnostics-storage-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.job.storage.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.job.storage.s3.secretAccessKey | quote }}
{{- else if and (eq .Values.job.storage.provider "gcs") .Values.job.storage.gcs.credentialsJson }}
apiVersion: v1
kind: Secret
metadata:
  name: router-diagnostics-storage-credentials
type: Opaque
stringData:
  key.json: {{ .Values.job.storage.gcs.credentialsJson | quote }}
{{- end }}
{{- end }}
