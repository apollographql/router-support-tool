# Only rendered for mode: job. Runs collection in-cluster using the namespace-scoped
# ServiceAccount from job-rbac.yaml.
{{- if eq .Values.mode "job" }}
{{- $secretName := include "router-diagnostics.storageSecretName" . }}
{{- $useS3Secret := and $secretName (eq .Values.job.storage.provider "s3") }}
{{- $useGCSSecret := and $secretName (eq .Values.job.storage.provider "gcs") }}
{{- $useURLSecret := and $secretName (eq .Values.job.storage.provider "url") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: router-diagnostics-job
  labels:
    troubleshoot.sh/kind: support-bundle-job
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished | default 3600 }}
  template:
    metadata:
      annotations:
        {{- include "router-diagnostics.jobPodAnnotations" . | nindent 8 }}
      {{- with .Values.job.podLabels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: router-diagnostics-job
      restartPolicy: Never
      containers:
        - name: support-bundle
          image: "{{ .Values.job.image.repository }}:{{ .Values.job.image.tag }}"
          imagePullPolicy: {{ .Values.job.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              {{- tpl (.Files.Get "files/collect-and-upload.sh.tpl") . | nindent 14 }}
            - collect-and-upload
            - {{ .Values.job.storage.provider | quote }}
            {{- if eq .Values.job.storage.provider "s3" }}
            - {{ .Values.job.storage.bucket | quote }}
            - {{ .Values.job.storage.prefix | quote }}
            - {{ .Values.job.storage.s3.region | quote }}
            - {{ .Values.job.storage.s3.endpoint | quote }}
            - {{ .Values.job.storage.s3.forcePathStyle | toString | quote }}
            {{- else if eq .Values.job.storage.provider "gcs" }}
            - {{ .Values.job.storage.bucket | quote }}
            - {{ .Values.job.storage.prefix | quote }}
            - {{ .Values.job.storage.gcs.project | quote }}
            {{- else if eq .Values.job.storage.provider "url" }}
            - {{ .Values.job.storage.url.endpoint | quote }}
            - {{ .Values.job.storage.url.method | default "PUT" | quote }}
            {{- end }}
          {{- if $useS3Secret }}
          envFrom:
            - secretRef:
                name: {{ $secretName }}
          {{- end }}
          {{- if $useGCSSecret }}
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/router-diagnostics-storage/key.json
          volumeMounts:
            - name: storage-credentials
              mountPath: /var/run/secrets/router-diagnostics-storage
              readOnly: true
          {{- end }}
          {{- if $useURLSecret }}
          volumeMounts:
            - name: storage-headers
              mountPath: /var/run/secrets/router-diagnostics-storage-headers
              readOnly: true
          {{- end }}
      {{- if $useGCSSecret }}
      volumes:
        - name: storage-credentials
          secret:
            secretName: {{ $secretName }}
      {{- end }}
      {{- if $useURLSecret }}
      volumes:
        - name: storage-headers
          secret:
            secretName: {{ $secretName }}
      {{- end }}
{{- end }}
