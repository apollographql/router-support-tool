# Only rendered for mode: job. Runs collection in-cluster using the namespace-scoped
# ServiceAccount from job-rbac.yaml.
{{- if eq .Values.mode "job" }}
{{- if not .Values.job.storage.provider }}
{{- fail "job.storage.provider is required for mode: job. Set job.storage.provider to s3, gcs, or url." }}
{{- end }}
{{- $secretName := include "router-diagnostics-chart.storageSecretName" . }}
{{- $useS3Secret := and $secretName (eq .Values.job.storage.provider "s3") }}
{{- $useGCSSecret := and $secretName (eq .Values.job.storage.provider "gcs") }}
{{- $useURLSecret := and $secretName (eq .Values.job.storage.provider "url") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: router-diagnostics-job-{{ .Release.Revision }}
  labels:
    troubleshoot.sh/kind: support-bundle-job
  annotations:
    # A Job's spec.template is immutable, so a new Job name is required on every
    # upgrade that changes it (e.g. any job.storage.* value) - see router-diagnostics-job's
    # own history for why. Without this annotation, Helm prunes the previous revision's
    # Job as soon as it's no longer part of the rendered manifest, destroying its pod and
    # logs in the same upgrade that was supposed to preserve them. TTL cleanup
    # (job.ttlSecondsAfterFinished) still applies per-Job regardless of this annotation.
    #
    # Known edge case: this annotation also stops `helm uninstall` from deleting the Job,
    # which means an `uninstall` immediately followed by a fresh `install` into the same
    # namespace can collide with a leftover Job from the prior install if its TTL hasn't
    # elapsed yet - `.Release.Revision` resets to 1 on a fresh install, so the new Job's
    # name can match one Helm left behind on purpose. See docs/getting-started/job-mode.mdx
    # -> "Cleaning up" for how this is documented to customers.
    helm.sh/resource-policy: keep
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished | default 3600 }}
  template:
    metadata:
      annotations:
        {{- include "router-diagnostics-chart.jobPodAnnotations" . | nindent 8 }}
      {{- with .Values.job.podLabels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.job.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: router-diagnostics-job
      restartPolicy: Never
      containers:
        - name: support-bundle
          image: "{{ .Values.job.image.repository }}:{{ .Values.job.image.tag }}"
          imagePullPolicy: {{ .Values.job.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              {{- tpl (.Files.Get "files/collect-and-upload.sh") . | nindent 14 }}
            - collect-and-upload
            - {{ .Values.job.storage.provider | quote }}
            {{- if eq .Values.job.storage.provider "s3" }}
            - {{ .Values.job.storage.bucket | quote }}
            - {{ .Values.job.storage.prefix | quote }}
            - {{ .Values.job.storage.s3.region | quote }}
            - {{ .Values.job.storage.s3.endpoint | quote }}
            - {{ .Values.job.storage.s3.forcePathStyle | toString | quote }}
            {{- else if eq .Values.job.storage.provider "gcs" }}
            - {{ .Values.job.storage.bucket | quote }}
            - {{ .Values.job.storage.prefix | quote }}
            - {{ .Values.job.storage.gcs.project | quote }}
            {{- else if eq .Values.job.storage.provider "url" }}
            - {{ .Values.job.storage.url.endpoint | quote }}
            - {{ .Values.job.storage.url.method | default "PUT" | quote }}
            {{- end }}
          {{- if $useS3Secret }}
          envFrom:
            - secretRef:
                name: {{ $secretName }}
          {{- end }}
          {{- if $useGCSSecret }}
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/router-diagnostics-storage/key.json
          volumeMounts:
            - name: storage-credentials
              mountPath: /var/run/secrets/router-diagnostics-storage
              readOnly: true
          {{- end }}
          {{- if $useURLSecret }}
          volumeMounts:
            - name: storage-headers
              mountPath: /var/run/secrets/router-diagnostics-storage-headers
              readOnly: true
          {{- end }}
      {{- if $useGCSSecret }}
      volumes:
        - name: storage-credentials
          secret:
            secretName: {{ $secretName }}
      {{- end }}
      {{- if $useURLSecret }}
      volumes:
        - name: storage-headers
          secret:
            secretName: {{ $secretName }}
      {{- end }}
{{- end }}
