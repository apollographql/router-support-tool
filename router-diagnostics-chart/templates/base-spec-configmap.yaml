# Always rendered, regardless of `mode`. `kubectl support-bundle --load-cluster-specs`
# discovers this via the `troubleshoot.sh/kind: support-bundle` label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: router-diagnostics-spec
  labels:
    troubleshoot.sh/kind: support-bundle
data:
  support-bundle-spec: |
    apiVersion: troubleshoot.sh/v1beta2
    kind: SupportBundle
    metadata:
      name: router-diagnostics-base
    spec:
      collectors:
        - clusterResources:
            collectorName: cluster-resources
            namespaces:
              - {{ .Values.namespace }}

        - logs:
            name: router-logs
            namespace: {{ .Values.namespace }}
            selector:
              - {{ .Values.selector | default "app.kubernetes.io/name=router" }}
            {{- if or .Values.logs.maxAge .Values.logs.maxLines }}
            limits:
              {{- if .Values.logs.maxAge }}
              maxAge: {{ .Values.logs.maxAge }}
              {{- end }}
              {{- if .Values.logs.maxLines }}
              maxLines: {{ .Values.logs.maxLines }}
              {{- end }}
            {{- end }}

        # Metrics collection differs by mode because pod IPs are only reachable in-cluster.
        # Job mode — support-bundle runs inside a Kubernetes Job and can reach pod IPs directly
        {{- if ne .Values.mode "local" }}
        {{- include "router-diagnostics-chart.routerMetricsCollectors" . | trim | nindent 8 }}
        {{- end }}

        - configMap:
            collectorName: router-config-rendered
            namespace: {{ .Values.namespace }}
            {{- if .Values.configMapName }}
            name: {{ .Values.configMapName }}
            {{- else }}
            selector:
              - {{ .Values.selector | default "app.kubernetes.io/name=router" }}
            {{- end }}
            includeAllData: true

        - nodeMetrics:
            collectorName: router-resource-usage

        - data:
            name: meta.json
            data: |
              {
                "spec_version": "1",
                "mode": "{{ .Values.mode }}",
                "namespace": "{{ .Values.namespace }}",
                {{- if eq .Values.mode "job" }}
                "sidecar_injection_disabled": {{ include "router-diagnostics-chart.sidecarInjectionDisabled" . }},
                {{- end }}
                "troubleshoot_version": "0.134.1"
              }
    # mode: local — support-bundle runs on the user's machine where pod IPs are not
    # reachable, so a hostCollectors.run script handles all port-forwards at collection time.
{{- if eq .Values.mode "local" }}
      hostCollectors:
        - run:
            collectorName: router-metrics
            outputDir: router-metrics
            command: sh
            args:
              - -c
              - |
                {{- tpl (.Files.Get "files/local-metrics-collect.sh") . | nindent 16 }}
{{- end }}
  redactor-spec: |
    apiVersion: troubleshoot.sh/v1beta2
    kind: Redactor
    metadata:
      name: router-diagnostics-redactors
    spec:
      redactors:
        # specs/collection/data_sanitization/jwt_and_auth_config.md
        - name: router-jwt-jwks-fetch-headers
          fileSelector:
            files:
              - "cluster-resources/configmaps/*.json"
              - "configmaps/*/*.json"
          removals:
            regex:
              - redactor: '(name:\s*\\?"?[^"\\\n]*\\?"?\\n\s*value:\s*\\?"?)(?P<mask>[^"\\\n]+)(\\?"?)'
              - redactor: '(\{(?:[^}\\]|\\")*?value:\s*\\?"?)(?P<mask>[^",}\\]+)(\\?"?)'
        - name: router-subgraph-aws-sigv4-hardcoded
          fileSelector:
            files:
              - "cluster-resources/configmaps/*.json"
              - "configmaps/*/*.json"
          removals:
            regex:
              - redactor: '(secret_access_key:\s*\\?"?)(?P<mask>[^"\\\n]+?)(\\?"?\\n)'
              - redactor: '(access_key_id:\s*\\?"?)(?P<mask>[^"\\\n]+?)(\\?"?\\n)'

        # specs/collection/data_sanitization/header_values.md
        - name: router-headers-insert-literal-values
          fileSelector:
            files:
              - "cluster-resources/configmaps/*.json"
              - "configmaps/*/*.json"
          removals:
            regex:
              - redactor: '(insert:\\n(?:\s*name:\s*\\?"?[^"\\\n]*\\?"?\\n)*\s*value:\s*\\?"?)(?P<mask>[^"\\\n]+)(\\?"?)'
              - redactor: '(insert:\s*\{(?:[^}\\]|\\")*?value:\s*\\?"?)(?P<mask>[^",}\\]+)(\\?"?(?:[^}\\]|\\")*?\})'
              - redactor: '(insert:\\n(?:\s*(?:name|path):\s*\\?"?[^"\\\n]*\\?"?\\n)*\s*default:\s*\\?"?)(?P<mask>[^"\\\n]+)(\\?"?)'
              - redactor: '(insert:\s*\{(?:[^}\\]|\\")*?default:\s*\\?"?)(?P<mask>[^",}\\]+)(\\?"?(?:[^}\\]|\\")*?\})'
        - name: router-headers-propagate-default
          fileSelector:
            files:
              - "cluster-resources/configmaps/*.json"
              - "configmaps/*/*.json"
          removals:
            regex:
              - redactor: '(propagate:\\n(?:\s*(?:named|rename):\s*\\?"?[^"\\\n]*\\?"?\\n)*\s*default:\s*\\?"?)(?P<mask>[^"\\\n]+)(\\?"?)'
              - redactor: '(propagate:\s*\{(?:[^}\\]|\\")*?default:\s*\\?"?)(?P<mask>[^",}\\]+)(\\?"?(?:[^}\\]|\\")*?\})'

        # specs/collection/data_sanitization/operation_bodies.md
        - name: router-log-request-body
          fileSelector:
            files:
              - "cluster-resources/pods/logs/*/*/*.log"
              - "router-logs/*/*.log"
          removals:
            regex:
              - redactor: '("http\.request\.body":")(?P<mask>(?:[^"\\]|\\.)*)(")'
        - name: router-log-response-body
          fileSelector:
            files:
              - "cluster-resources/pods/logs/*/*/*.log"
              - "router-logs/*/*.log"
          removals:
            regex:
              - redactor: '("http\.response\.body":")(?P<mask>(?:[^"\\]|\\.)*)(")'

        # specs/collection/data_sanitization/subgraph_urls.md
        - name: router-subgraph-url
          fileSelector:
            files:
              - "cluster-resources/configmaps/*.json"
              - "configmaps/*/*.json"
          removals:
            regex:
              - redactor: '(override_subgraph_url:)(?P<mask>(?:\\n\s+[\w.-]+:\s*(?:\\"[^"\\]*\\"|[^\\@"]+))+)'
        - name: router-subgraph-url-schema
          fileSelector:
            files:
              - "cluster-resources/configmaps/*.json"
              - "configmaps/*/*.json"
          removals:
            regex:
              - redactor: '(@join__graph\([^)]*url:\s*\\?")(?P<mask>[^"\\]*)(\\?")'
              - redactor: '(baseURL:\s*\\?")(?P<mask>[^"\\]*)(\\?")'

        # specs/collection/data_sanitization/redis_credentials.md
        - name: router-redis-url-embedded-credentials
          fileSelector:
            files:
              - "cluster-resources/configmaps/*.json"
              - "configmaps/*/*.json"
          removals:
            regex:
              - redactor: '((?:rediss?(?:-cluster|-sentinel)?):\/\/)(?P<mask>[^\/@"\\]*:[^\/@"\\]+)(@)'
        - name: router-redis-username-password
          fileSelector:
            files:
              - "cluster-resources/configmaps/*.json"
              - "configmaps/*/*.json"
          removals:
            regex:
              - redactor: '(username:\s*\\?"?)(?P<mask>[^"\\\n]+?)(\\?"?\\n)'
              - redactor: '(password:\s*\\?"?)(?P<mask>[^"\\\n]+?)(\\?"?\\n)'

        # specs/collection/data_sanitization/tls_private_keys.md
        - name: router-tls-private-keys
          fileSelector:
            files:
              - "cluster-resources/configmaps/*.json"
              - "configmaps/*/*.json"
          removals:
            regex:
              - redactor: '(-----BEGIN (?:RSA |EC |ENCRYPTED )?PRIVATE KEY-----)(?P<mask>.+?)(-----END (?:RSA |EC |ENCRYPTED )?PRIVATE KEY-----)'
