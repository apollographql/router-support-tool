# Only rendered for mode: job. The namespace-scoped Role covers everything
# clusterResources/logs/configMap/router-metrics/router-resource-usage need within
# .Values.namespace.
# The ClusterRole below is only for the cluster-scoped kubelet grants and is independently
# gated by job.collectNodeMetrics, since the installing identity may not be grantable
# cluster-scoped RBAC.
{{- /* job.serviceAccount.create false: the customer owns the ServiceAccount and its grants. */}}
{{- if and (eq .Values.mode "job") .Values.job.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: router-diagnostics-job
  {{- with .Values.job.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-diagnostics-job
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - persistentvolumeclaims
      - pods
      - pods/log
      - resourcequotas
      - serviceaccounts
      - services
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - rolebindings
      - roles
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-diagnostics-job
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-diagnostics-job
subjects:
  - kind: ServiceAccount
    name: router-diagnostics-job
    namespace: {{ .Release.Namespace }}
{{- if .Values.job.collectNodeMetrics }}
---
# Cluster-scoped: names include the namespace to avoid colliding with another
# router-diagnostics install elsewhere in the same cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: router-diagnostics-{{ .Values.namespace }}-nodemetrics
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  # The kubelet authorizes /stats/* as nodes/stats. nodes/proxy is not read-only
  # (Kubernetes' documentation), so it is not granted.
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: router-diagnostics-{{ .Values.namespace }}-nodemetrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: router-diagnostics-{{ .Values.namespace }}-nodemetrics
subjects:
  - kind: ServiceAccount
    name: router-diagnostics-job
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
