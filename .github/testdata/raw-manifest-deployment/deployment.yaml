# Router deployment for CI to collect against
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app.kubernetes.io/name: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
    spec:
      containers:
        - name: router
          # renovate: datasource=github-releases depName=apollographql/router
          image: ghcr.io/apollographql/router:v2.16.3
          # Set purely so the integration test has a real value to assert clusterResources
          # actually captured.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          args:
            - "--config"
            - "/etc/router/router.yaml"
            - "--supergraph"
            - "/etc/router/supergraph.graphql"
          ports:
            - containerPort: 4000
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 1
            periodSeconds: 2
          volumeMounts:
            - name: router-config
              mountPath: /etc/router
      volumes:
        - name: router-config
          configMap:
            name: router-config
---
apiVersion: v1
kind: Service
metadata:
  name: router
  labels:
    app.kubernetes.io/name: router
spec:
  selector:
    app.kubernetes.io/name: router
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
    - name: graphql
      port: 4000
      targetPort: 4000
