# Enables the KubeletPSI feature gate (alpha, off by default) so nodeMetrics can report
# cpu.psi/memory.psi - see specs/collection/base_spec.md footnote [2]. Shared by both
# integration test workflows since neither exercises psi otherwise.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            feature-gates: "KubeletPSI=true"
