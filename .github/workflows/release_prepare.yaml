name: "Release: Prepare"

# Manually triggered to start cutting a release (specs/release-process.md, step 4). Bumps every
# checked-in version, generates this release's notes from pending changesets, opens a draft
# GitHub Release with those notes for preview, and opens a PR for review.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / tag name (e.g. 1.2.3)"
        type: string
        required: true

jobs:
  prepare:
    name: "Prepare release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install mise tools"
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: yq

      - name: "Validate version format"
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like X.Y.Z (no leading v), got '${{ inputs.version }}'"
            exit 1
          fi

      - name: "Get current version"
        id: current
        run: echo "version=$(yq '.version' router-diagnostics-chart/Chart.yaml)" >> "$GITHUB_OUTPUT"

      # Every published tag - the chart's own version, its OCI tag, the Job image tag, and
      # the release/git tag - must all be bare semver (no leading v). Helm's OCI client
      # resolves an unpinned `helm install oci://...` by sorting tags as semver; a non-semver
      # tag like `v1.0.0` can't be parsed, which breaks that resolution entirely, not just for
      # that one tag - see the v1.0.0 incident this comment replaced.
      - name: "Bump chart and Job image versions"
        run: |
          yq -i ".version = \"${VERSION}\"" router-diagnostics-chart/Chart.yaml
          yq -i ".job.image.tag = \"${VERSION}\"" router-diagnostics-chart/values.yaml
        env:
          VERSION: ${{ inputs.version }}

      - name: "Regenerate Helm docs"
        run: mise run generate-helm-docs

      - name: "Prepare release notes from changesets"
        run: scripts/prepare_release_notes.sh "${{ inputs.version }}"

      - name: "Create draft GitHub Release"
        id: draft_release
        run: |
          URL=$(gh release create "${{ inputs.version }}" \
            --draft \
            --title "${{ inputs.version }}" \
            --notes-file ".changeset/notes/${{ inputs.version }}.md")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "Open release PR"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          body: |
            ## Release ${{ inputs.version }}

            This PR was generated by the **Release: Prepare** workflow.

            **Full diff since last release:** ${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.current.outputs.version }}...release/${{ inputs.version }}

            **Draft release notes:** ${{ steps.draft_release.outputs.url }}

            ### What's included
            - Version bumped to `${{ inputs.version }}` in the chart and its pinned Job image tag
            - Draft GitHub Release created with generated release notes
            - Consumed changeset files removed

            ### After merging
            Merge this normally (not with auto-merge). Once CI passes on `main`, the
            **Release: Finalize** workflow automatically publishes the draft release above
            (tagging this commit `${{ inputs.version }}`) and runs `release_publish_artifacts.yaml`
            — no separate manual tag/publish step needed.
          branch: "release/${{ inputs.version }}"
          commit-message: "Release ${{ inputs.version }}"
          labels: release
          title: "Release ${{ inputs.version }}"
