name: "Release: Publish Artifacts"

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Commit SHA the internal image was built from"
        type: string
        required: true
      version:
        description: "Release version / tag name (e.g. v1.2.3)"
        type: string
        required: true
  # Manual entry point: run this directly to retry publishing an already-tagged release,
  #  e.g. after a partial failure.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to publish the image from. Leave blank to resolve it from the vX.Y.Z tag."
        type: string
        required: false
      version:
        description: "Release version / tag name (e.g. v1.2.3) — must already be tagged"
        type: string
        required: true

jobs:
  resolve_sha:
    name: "Resolve commit SHA"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: "Resolve commit SHA"
        id: resolve
        run: |
          if [[ -n "${{ inputs.commit_sha }}" ]]; then
            echo "sha=${{ inputs.commit_sha }}" >> "$GITHUB_OUTPUT"
          else
            SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/${{ inputs.version }}" --jq .object.sha)
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  release_dockerhub:
    name: "Release Job image to DockerHub"
    needs: [resolve_sha]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: apollographql/release-tooling/release-dockerhub@6ab89bdcf9cd1a86ecaa85925b75e003405e5edc
        with:
          commit_sha: ${{ needs.resolve_sha.outputs.commit_sha }}
          image_name: router-diagnostics
          version_number: ${{ inputs.version }}

  publish_helm_chart:
    name: "Publish Helm chart to DockerHub"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout code at release tag"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      # Packages from the checked-out release tag and publishes to
      # oci://registry-1.docker.io/apollograph/router-diagnostics-chart. Chart.yaml's own
      # `name` already matches, so no chart_name override is needed.
      - name: "Publish Helm chart"
        uses: apollographql/release-tooling/release-helm-dockerhub@6ab89bdcf9cd1a86ecaa85925b75e003405e5edc
        with:
          chart_path: router-diagnostics-chart
          version: ${{ inputs.version }}

  set_release_notes:
    name: "Set GitHub Release notes from .changeset/notes"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout code at release tag"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      # .changeset/notes/<version>.md was generated and committed by
      # scripts/prepare_release_notes.sh as part of the version-bump PR (see
      # specs/release-process.md, step 4). Overwrites whatever notes were present when the
      # release was published — this file is the source of truth once this automation is
      # in place.
      - name: "Set release notes"
        run: gh release edit "${{ inputs.version }}" --notes-file ".changeset/notes/${{ inputs.version }}.md"
        env:
          GH_TOKEN: ${{ github.token }}

  attach_collect_script:
    name: "Attach collect.sh to GitHub Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout code at release tag"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: "Upload collect.sh as a release asset"
        run: gh release upload "${{ inputs.version }}" router-diagnostics-collect/collect.sh --clobber
        env:
          GH_TOKEN: ${{ github.token }}
