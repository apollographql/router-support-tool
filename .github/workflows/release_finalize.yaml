name: "Release: Finalize"

# Runs automatically after every required check has succeeded on a push to main after a
# release PR from release_prepare.yaml is merged.
on:
  workflow_run:
    types: [completed]
    # Each of these fires this trigger independently the moment that one workflow completes,
    # it does not wait for all of them. The "every required check succeeded" gate is done
    # explicitly in the finalize job below instead.
    workflows: [
        "Official Chart Collect Script Integration Test",
        "Raw-Manifest Collect Script Integration Test"
      ]

jobs:
  finalize:
    name: "Finalize release"
    # Only run when the triggering workflow succeeded on a push (not a PR)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ github.event.workflow_run.head_sha }}
      release_needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          # On a workflow_run trigger, github.sha is the tip of the default branch right now,
          # not necessarily the commit that actually triggered this run — head_sha is that
          # exact commit.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: "Install mise tools"
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: yq

      - name: "Check that every required workflow succeeded for this commit"
        id: gate
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          READY=true
          for WORKFLOW in "Static Checks" "Test with RTF" "Official Chart Collect Script Integration Test" "Raw-Manifest Collect Script Integration Test"; do
            # gh api's --jq takes a single filter expression, not extra jq flags like --arg —
            # inlining WORKFLOW here is safe since it only ever comes from the fixed literal
            # list above, never from external input.
            CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}" \
              --jq ".workflow_runs[] | select(.name == \"$WORKFLOW\") | .conclusion" | head -n1)
            CONCLUSION="${CONCLUSION:-pending}"
            echo "$WORKFLOW: $CONCLUSION"
            [[ "$CONCLUSION" != "success" ]] && READY=false
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "Check if a release is needed"
        id: check
        if: steps.gate.outputs.ready == 'true'
        run: |
          VERSION="v$(yq '.version' router-diagnostics-chart/Chart.yaml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh api "repos/${{ github.repository }}/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. No release needed."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION has no tag yet. Finalizing release."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "Publish the draft GitHub Release"
        if: steps.gate.outputs.ready == 'true' && steps.check.outputs.needed == 'true'
        run: |
          gh release edit "${{ steps.check.outputs.version }}" \
            --draft=false \
            --tag "${{ steps.check.outputs.version }}" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

  publish_artifacts:
    name: "Publish artifacts"
    needs: [finalize]
    if: needs.finalize.outputs.release_needed == 'true'
    uses: ./.github/workflows/release_publish_artifacts.yaml
    with:
      version: ${{ needs.finalize.outputs.version }}
      commit_sha: ${{ needs.finalize.outputs.commit_sha }}
    secrets: inherit
