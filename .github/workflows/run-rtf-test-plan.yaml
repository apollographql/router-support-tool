name: Test with RTF

# Builds the Job image and runs RTF against it
on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  build_job_image:
    name: "Build router-diagnostics Job image"
    permissions:
      contents: read
      id-token: write
    uses: apollographql/release-tooling/.github/workflows/build_and_publish.yml@6ab89bdcf9cd1a86ecaa85925b75e003405e5edc
    with:
      image_name: router-diagnostics
      image_description: "Collection binary and object-storage upload tooling for the router support tool's job mode."
      platforms: '[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
      context: router-diagnostics-job-image
      dockerfile_location: router-diagnostics-job-image/Dockerfile
    secrets: inherit

  run_rtf_test_plan:
    name: Run RTF Test Plan
    needs: [build_job_image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Resolve commit SHA"
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - uses: apollographql/release-tooling/rtf-orchestrator-run-known@0164abcc44f36be7659ce0be5bc984e4f44614d1
        with:
          git_ref: ${{ steps.resolve.outputs.sha }}
          test_plan_id: d92be985-ca2a-457c-9fc8-d692256782ae
