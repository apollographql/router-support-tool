name: Static Checks

on:
  merge_group:
  # Deliberately the default types (opened, synchronize, reopened) — no `edited`.
  # Editing a description cannot change what any job here would conclude, and a
  # run triggered by an edit would have to either repeat the whole suite or skip
  # it and report a verdict derived from nothing, overwriting the real run's
  # result for the same commit. The changelog check is the one thing that does
  # care about the description, and it lives in changelog.yml for that reason.
  pull_request:
  push:
    branches:
      - main

# For simplicity, since only one chart exists it's hardcoded for now.
# We can add a discovery step later when we add more charts.
env:
  CHART_PATH: router-diagnostics

jobs:
  ensure_helm_docs_consistency:
    name: "Ensure Helm Chart Docs Consistency"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@3a4528e97c49a5e83de6b78c50c61c8ee5c9f944 # v2.0.0
        with:
          chart-search-root: 'router-diagnostics'
          fail-on-diff: true

  format_github_actions_workflows:
    name: "Check GitHub Actions Workflow Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: "Run ghafmt"
        uses: jonathanrainer/ghafmt@070608df18a658ddcc691f000fbf09c7090f0b37 # v0.1.5
        with:
          mode: check

  # Chart rendering across tiers and modes:
  # Run helm template with each deployment tier's (official chart, raw-manifest)
  # and mode's (local, job) actual values, then schema-validated with kubeconform.
  helm_lint:
    name: "Chart Render (${{ matrix.tier }}, mode: ${{ matrix.mode }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [job, local]
        tier: [official-chart, raw-manifest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform

      - name: Render values for this tier/mode
        id: values
        run: |
          FLAGS="--set namespace=ci-test"

          case "${{ matrix.tier }}" in
            official-chart)
              # Defaults apply: selector/configMapName unset.
              ;;
            raw-manifest)
              FLAGS="$FLAGS --set selector=app=hello-world --set configMapName=hello-world-config"
              ;;
          esac

          case "${{ matrix.mode }}" in
            local)
              FLAGS="$FLAGS --set mode=local"
              ;;
            job)
              # Not a real image — this job only renders manifests, it never runs the Job.
              FLAGS="$FLAGS --set mode=job --set job.image.repository=ci-placeholder --set job.image.tag=v0.0.0"
              ;;
          esac

          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: helm lint
        run: helm lint "$CHART_PATH" ${{ steps.values.outputs.flags }}

      - name: helm template
        run: helm template ci-test "$CHART_PATH" ${{ steps.values.outputs.flags }} > rendered.yaml

      - name: Validate rendered manifests against Kubernetes schema
        run: kubeconform -strict -summary rendered.yaml

  # Spec linting across troubleshoot.sh versions:
  # Run yhr support-bundle lint against the rendered spec
  # once per pinned troubleshoot.sh version in scope: the
  # declared floor (read from the chart's own rendered meta.json) and the current release.
  determine_support_bundle_versions:
    name: Determine troubleshoot.sh Versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3

      - name: Determine floor and current versions
        id: versions
        run: |
          FLOOR=$(helm template ci-test "$CHART_PATH" --set namespace=ci-test --set mode=local \
            --show-only templates/base-spec-configmap.yaml \
            | yq '.data["support-bundle-spec"]' \
            | yq '.spec.collectors[] | select(has("data")) | .data.data' \
            | jq -r '.min_troubleshoot_version')

          CURRENT=$(curl -sL https://api.github.com/repos/replicatedhq/troubleshoot/releases/latest | jq -r '.tag_name | ltrimstr("v")')

          echo "Declared floor: $FLOOR"
          echo "Current release: $CURRENT"

          VERSIONS=$(jq -cn --arg floor "$FLOOR" --arg current "$CURRENT" '[$floor, $current] | unique')
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  spec_lint:
    name: "Spec Lint (support-bundle ${{ matrix.support_bundle_version }})"
    needs: determine_support_bundle_versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        support_bundle_version: ${{ fromJson(needs.determine_support_bundle_versions.outputs.versions) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3

      - name: Install support-bundle ${{ matrix.support_bundle_version }}
        run: |
          curl -sL "https://github.com/replicatedhq/troubleshoot/releases/download/v${{ matrix.support_bundle_version }}/support-bundle_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin support-bundle

      - name: "Extract rendered spec (mode: local)"
        run: |
          helm template ci-test "$CHART_PATH" --set namespace=ci-test --set mode=local \
            --show-only templates/base-spec-configmap.yaml \
            | yq '.data["support-bundle-spec"]' > rendered-spec.local.yaml

      - name: "Extract rendered spec (mode: job)"
        run: |
          helm template ci-test "$CHART_PATH" --set namespace=ci-test --set mode=job \
            --set job.image.repository=ci-placeholder --set job.image.tag=v0.0.0 \
            --show-only templates/base-spec-configmap.yaml \
            | yq '.data["support-bundle-spec"]' > rendered-spec.job.yaml

      - name: support-bundle lint
        run: |
          support-bundle lint --format json rendered-spec.local.yaml rendered-spec.job.yaml
