name: Static Checks

on:
  pull_request:
    # Explicit types are required here because listing any `types:` overrides GitHub's
    # default set (opened, synchronize, reopened) rather than adding to it. `labeled` is
    # added so that applying the `skip-changeset` label to an already-open PR re-runs
    # check_changeset against the PR's current labels — otherwise that job's `if:` only
    # ever sees whatever labels existed at the moment of the triggering event, and a label
    # added afterward has no run left to apply to.
    types: [labeled, opened, reopened, synchronize]
  push:
    branches:
      - main

# For simplicity, since only one chart exists it's hardcoded for now.
# We can add a discovery step later when we add more charts.
env:
  CHART_PATH: router-diagnostics-chart

jobs:
  ensure_helm_docs_consistency:
    name: "Ensure Helm Chart Docs Consistency"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@3a4528e97c49a5e83de6b78c50c61c8ee5c9f944 # v2.0.0
        with:
          chart-search-root: 'router-diagnostics-chart'
          fail-on-diff: true

  format_github_actions_workflows:
    name: "Check GitHub Actions Workflow Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: "Run ghafmt"
        uses: jonathanrainer/ghafmt@070608df18a658ddcc691f000fbf09c7090f0b37 # v0.1.5
        with:
          mode: check

  # Chart rendering across tiers and modes:
  # Run helm template with each deployment tier's (official chart, raw-manifest)
  # and mode's (local, job) actual values, then schema-validated with kubeconform.
  helm_lint:
    name: "Chart Render (${{ matrix.tier }}, mode: ${{ matrix.mode }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [job, local]
        tier: [official-chart, raw-manifest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform

      - name: Render values for this tier/mode
        id: values
        run: |
          FLAGS="--set namespace=ci-test"

          case "${{ matrix.tier }}" in
            official-chart)
              # Defaults apply: selector/configMapName unset.
              ;;
            raw-manifest)
              FLAGS="$FLAGS --set selector=app=hello-world --set configMapName=hello-world-config"
              ;;
          esac

          case "${{ matrix.mode }}" in
            local)
              FLAGS="$FLAGS --set mode=local"
              ;;
            job)
              # Not a real image — this job only renders manifests, it never runs the Job.
              FLAGS="$FLAGS --set mode=job --set job.image.repository=ci-placeholder --set job.image.tag=v0.0.0 --set job.storage.provider=s3 --set job.storage.bucket=ci-test"
              ;;
          esac

          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: helm lint
        run: helm lint "$CHART_PATH" ${{ steps.values.outputs.flags }}

      - name: helm template
        run: helm template ci-test "$CHART_PATH" ${{ steps.values.outputs.flags }} > rendered.yaml

      - name: Validate rendered manifests against Kubernetes schema
        run: kubeconform -strict -summary rendered.yaml

  # Spec linting against the pinned troubleshoot.sh version
  spec_lint:
    name: "Spec Lint (support-bundle)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3

      - name: Determine pinned troubleshoot.sh version
        id: version
        run: |
          VERSION=$(helm template ci-test "$CHART_PATH" --set namespace=ci-test --set mode=local \
            --show-only templates/base-spec-configmap.yaml \
            | yq '.data["support-bundle-spec"]' \
            | yq '.spec.collectors[] | select(has("data")) | .data.data' \
            | jq -r '.troubleshoot_version')

          echo "Pinned version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install support-bundle ${{ steps.version.outputs.version }}
        run: |
          curl -sSLf "https://github.com/replicatedhq/troubleshoot/releases/download/v${{ steps.version.outputs.version }}/support-bundle_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin support-bundle

      - name: "Extract rendered spec (mode: local)"
        run: |
          helm template ci-test "$CHART_PATH" --set namespace=ci-test --set mode=local \
            --show-only templates/base-spec-configmap.yaml \
            | yq '.data["support-bundle-spec"]' > rendered-spec.local.yaml

      - name: "Extract rendered spec (mode: job)"
        run: |
          helm template ci-test "$CHART_PATH" --set namespace=ci-test --set mode=job \
            --set job.image.repository=ci-placeholder --set job.image.tag=v0.0.0 \
            --set job.storage.provider=s3 --set job.storage.bucket=ci-test \
            --show-only templates/base-spec-configmap.yaml \
            | yq '.data["support-bundle-spec"]' > rendered-spec.job.yaml

      - name: support-bundle lint
        run: |
          support-bundle lint --format json rendered-spec.local.yaml rendered-spec.job.yaml

  # Catches a collector or redactor being renamed, added, or removed without the checked-in
  # baseline being updated in the same PR. Not a naming-convention check - see
  # mise-tasks/check-spec-inventory for why collectors and redactors are tracked together
  # despite specs/collection/collector_naming.md only governing collector names.
  spec_inventory_check:
    name: "Spec Inventory Baseline"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Check collector/redactor inventory against the baseline
        run: mise run check-spec-inventory

  # Verifies collect.sh runs its own cached, version-pinned support-bundle binary.
  collect_script_uses_own_binary:
    name: "collect.sh uses its own binary, not PATH"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Run test-collect-script
        run: mise run test-collect-script

  metrics_fallback_message:
    name: "mode: local emits fallback message when metrics unavailable"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Run test-metrics-fallback
        run: mise run test-metrics-fallback

  check_changeset:
    name: "Verify Changeset Present"
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'svc-secops'
      && github.event.pull_request.user.login != 'renovate[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
      && !contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: "Install mise tools"
        # renovate: datasource=github-releases depName=jdx/mise-action
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: yq
          # renovate: datasource=github-releases depName=jdx/mise
          version: "v2026.9.2"

      - name: "Check for changeset"
        run: mise run check-changeset
