name: Collect Script Integration Test

# Exercises router-diagnostics-collect/collect.sh (mode: local) against a kind cluster
# via the Chainsaw tests.
# This workflow only orchestrates - cluster creation and the tests are both plain mise tasks:
# `mise run kind-up && mise run e2e-chainsaw`.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  exercise_local_collect:
    name: "Exercise collect.sh (mode: local) against a kind cluster"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: testing/kind-config.yaml

      - name: Run Chainsaw tests
        run: mise run e2e-chainsaw
        env:
          CHAINSAW_TEST_DIRS: >-
            testing/chainsaw/raw-manifest
            testing/chainsaw/multi-release
            testing/chainsaw/official-chart
            testing/chainsaw/official-chart-metrics-no-servicemonitor
            testing/chainsaw/job-mode-rbac
            testing/chainsaw/job-storage-credentials

      - name: Upload bundle for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-bundle
          # Chainsaw's script steps run with the test's own directory as their working
          # directory, not the repo root - this is where collect.sh actually leaves it.
          path: |
            testing/chainsaw/raw-manifest/support-bundle-*.tar.gz
            testing/chainsaw/multi-release/support-bundle-*.tar.gz
            testing/chainsaw/official-chart/support-bundle-*.tar.gz
          retention-days: 3

  exercise_helm_version_install_tests:
    name: "Exercise Helm install paths (helm: v${{ matrix.helm_version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm_version: ["3.17.3", "4.3.0"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: testing/kind-config.yaml

      - name: Run Chainsaw tests
        run: mise run e2e-chainsaw
        env:
          CHAINSAW_TEST_DIRS: >-
            testing/chainsaw/official-chart
            testing/chainsaw/job-mode-rbac
            testing/chainsaw/job-storage-credentials
          HELM_VERSION: ${{ matrix.helm_version }}

      - name: Upload bundle for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-bundle-official-chart-helm-v${{ matrix.helm_version }}
          path: testing/chainsaw/official-chart/support-bundle-*.tar.gz
          retention-days: 3

  exercise_local_collect_windows:
    name: "Exercise collect.ps1 (mode: local) against a kind cluster"
    runs-on: windows-latest
    env:
      TEST_NAMESPACE: chainsaw-raw-manifest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # kind on windows-latest uses Docker Desktop's Linux-container support.
      # The same kind-config.yaml works here — KubeletPSI runs in the Linux guest.
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: testing/kind-config.yaml

      - name: Deploy router to cluster
        run: |
          kubectl create namespace $env:TEST_NAMESPACE

          # Mirror the raw-manifest Chainsaw test: same router.yaml and supergraph.graphql.
          kubectl create configmap router-config -n $env:TEST_NAMESPACE `
            --from-file=router.yaml=testing/chainsaw/raw-manifest/router.yaml `
            --from-file=supergraph.graphql=testing/fixtures/supergraph.graphql
          kubectl label configmap router-config -n $env:TEST_NAMESPACE app.kubernetes.io/name=router

          kubectl apply -n $env:TEST_NAMESPACE -f testing/chainsaw/raw-manifest/resource.yaml

          # router.yaml enables prometheus metrics on 9091 (deliberately not 9090,
          # to exercise the metricsPort override path). The readinessProbe targets
          # /metrics on 9091, so Available implies the metrics endpoint is up.
          kubectl wait deployment/router -n $env:TEST_NAMESPACE `
            --for=condition=Available --timeout=180s
        shell: pwsh

      - name: "Install router-diagnostics chart (mode: local)"
        run: |
          helm install router-diagnostics ./router-diagnostics-chart `
            -n $env:TEST_NAMESPACE `
            --set namespace=$env:TEST_NAMESPACE `
            --set mode=local `
            --set metricsPort=9091
        shell: pwsh

      # Image pulls on Windows runners can be slower than on Linux. kind-action's
      # default wait_for_ready already retries, but collection itself gets extra time
      # via the sleep step below.
      # Wait for kubelet to complete one stats-collection cycle so that per-container
      # nodeMetrics (cpu.psi, memory.psi) are present when support-bundle runs.
      # Doubles the Chainsaw raw-manifest test's 15 s sleep to give Windows runners
      # extra time for kubelet's slower stats-collection cycle.
      - name: Wait for cluster metrics to stabilise
        run: Start-Sleep -Seconds 30
        shell: pwsh

      - name: Run collect.ps1 against the cluster
        run: |
          ../../../router-diagnostics-collect/collect.ps1 -Namespace $env:TEST_NAMESPACE
        shell: pwsh
        working-directory: testing/chainsaw/raw-manifest

      - name: Assert support bundle was produced
        run: |
          $bundle = Get-ChildItem -Filter 'support-bundle-*.tar.gz' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $bundle) {
            Write-Error 'No support bundle was produced by collect.ps1'
            exit 1
          }
          if ($bundle.Length -eq 0) {
            Write-Error "Support bundle is empty: $($bundle.Name)"
            exit 1
          }

          Write-Host "Bundle produced: $($bundle.Name) ($($bundle.Length) bytes)"

          # Verify the bundle has the expected top-level directories: at minimum
          # cluster-resources (always collected) and router-logs (requires a running pod).
          $entries = tar -tf $bundle.Name
          $hasClusters = $entries | Where-Object { $_ -match '^[^/]+/cluster-resources/' }
          $hasLogs     = $entries | Where-Object { $_ -match '^[^/]+/router-logs/' }

          if (-not $hasClusters) {
            Write-Error "Bundle is missing cluster-resources directory: $($bundle.Name)"
            exit 1
          }
          if (-not $hasLogs) {
            Write-Error "Bundle is missing router-logs directory: $($bundle.Name)"
            exit 1
          }

          Write-Host 'Bundle structure check passed.'
        shell: pwsh
        working-directory: testing/chainsaw/raw-manifest

      - name: Upload bundle for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-bundle-windows
          path: testing/chainsaw/raw-manifest/support-bundle-*.tar.gz
          retention-days: 3
