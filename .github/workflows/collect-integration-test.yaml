name: Collect Script Integration Test

# Exercises router-diagnostics-collect/collect.sh (mode: local) against a kind cluster
# via the Chainsaw tests.
# This workflow only orchestrates - cluster creation and the tests are both plain mise tasks:
# `mise run kind-up && mise run e2e-chainsaw`.
on:
  pull_request:
  push:
    branches:
      - main

env:
  # Router 3 preview the exercise_router_3_preview job installs from the official Helm chart.
  # Renovate bumps it within the 3.x line (see .github/renovate.json5).
  ROUTER_3_CHART_VERSION: "3.0.0-preview.0"

jobs:
  exercise_local_collect:
    name: "Exercise collect.sh (mode: local) against a kind cluster"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: testing/kind-config.yaml

      - name: Run Chainsaw tests
        run: mise run e2e-chainsaw
        env:
          CHAINSAW_TEST_DIRS: >-
            testing/chainsaw/raw-manifest
            testing/chainsaw/multi-release
            testing/chainsaw/official-chart
            testing/chainsaw/official-chart-metrics-no-servicemonitor
            testing/chainsaw/job-mode-rbac
            testing/chainsaw/job-storage-credentials

      - name: Upload bundle for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-bundle
          # Chainsaw's script steps run with the test's own directory as their working
          # directory, not the repo root - this is where collect.sh actually leaves it.
          path: |
            testing/chainsaw/raw-manifest/support-bundle-*.tar.gz
            testing/chainsaw/multi-release/support-bundle-*.tar.gz
            testing/chainsaw/official-chart/support-bundle-*.tar.gz
          retention-days: 3

  exercise_helm_version_install_tests:
    name: "Exercise Helm install paths (helm: v${{ matrix.helm_version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm_version: ["3.17.3", "4.3.0"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: testing/kind-config.yaml

      - name: Run Chainsaw tests
        run: mise run e2e-chainsaw
        env:
          CHAINSAW_TEST_DIRS: >-
            testing/chainsaw/official-chart
            testing/chainsaw/job-mode-rbac
            testing/chainsaw/job-storage-credentials
          HELM_VERSION: ${{ matrix.helm_version }}

      - name: Upload bundle for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-bundle-official-chart-helm-v${{ matrix.helm_version }}
          path: testing/chainsaw/official-chart/support-bundle-*.tar.gz
          retention-days: 3

  exercise_router_3_preview:
    name: "Exercise official chart against Router 3 preview"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: testing/kind-config.yaml

      - name: Run Chainsaw tests
        run: mise run e2e-chainsaw
        env:
          CHAINSAW_TEST_DIRS: testing/chainsaw/official-chart
          ROUTER_CHART_VERSION: ${{ env.ROUTER_3_CHART_VERSION }}

      - name: Upload bundle for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-bundle-official-chart-router-3
          path: testing/chainsaw/official-chart/support-bundle-*.tar.gz
          retention-days: 3

  exercise_local_collect_windows:
    name: "Exercise collect.ps1 logic (mocked support-bundle)"
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up support-bundle stub
        run: |
          $runDir = Join-Path $env:RUNNER_TEMP 'collect-run'
          New-Item -ItemType Directory -Force $runDir | Out-Null

          $stub = "$env:GITHUB_WORKSPACE\testing\mock-troubleshoot.ps1"
          Add-Content $env:GITHUB_ENV "COLLECT_RUN_DIR=$runDir"
          Add-Content $env:GITHUB_ENV "SUPPORT_BUNDLE_BIN_OVERRIDE=$stub"
        shell: pwsh

      - name: Run collect.ps1 with mocked support-bundle
        run: |
          & "$env:GITHUB_WORKSPACE\router-diagnostics-collect\collect.ps1" -Namespace test-ns
        shell: pwsh
        working-directory: ${{ env.COLLECT_RUN_DIR }}

      - name: Assert support bundle was produced
        run: |
          $bundle = Get-ChildItem $env:COLLECT_RUN_DIR -Filter 'support-bundle-*.tar.gz' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $bundle) {
            Write-Error 'No support bundle was produced by collect.ps1'
            exit 1
          }
          if ($bundle.Length -eq 0) {
            Write-Error "Support bundle is empty: $($bundle.Name)"
            exit 1
          }

          Write-Host "Bundle produced: $($bundle.Name) ($($bundle.Length) bytes)"

          $entries = tar -tf $bundle.FullName
          $hasClusters = $entries | Where-Object { $_ -match '^[^/]+/cluster-resources/' }
          $hasLogs = $entries | Where-Object { $_ -match '^[^/]+/router-logs/' }

          if (-not $hasClusters) {
            Write-Error "Bundle is missing cluster-resources/: $($bundle.Name)"
            exit 1
          }
          if (-not $hasLogs) {
            Write-Error "Bundle is missing router-logs/: $($bundle.Name)"
            exit 1
          }

          Write-Host 'Bundle structure check passed.'
        shell: pwsh

      - name: Upload bundle for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-bundle-windows
          path: ${{ env.COLLECT_RUN_DIR }}/support-bundle-*.tar.gz
          retention-days: 3
