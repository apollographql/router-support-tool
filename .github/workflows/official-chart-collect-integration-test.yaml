name: Official Chart Collect Script Integration Test

# Exercises router-diagnostics-collect/collect.sh (mode: local) against a router deployed with
# the official apollographql/router Helm chart, via the Chainsaw test at
# testing/chainsaw/official-chart. This workflow only orchestrates - cluster creation and
# the test itself are both plain mise tasks: `mise run kind-up && mise run e2e-chainsaw`.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  exercise_official_chart:
    name: "Exercise collect.sh (mode: local) against the official router chart"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: testing/kind-config.yaml

      - name: Run the official-chart Chainsaw test
        run: mise run e2e-chainsaw
        env:
          CHAINSAW_TEST_DIRS: testing/chainsaw/official-chart

      - name: Upload bundle for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-chart-support-bundle
          # Chainsaw's script steps run with the test's own directory as their working
          # directory, not the repo root - this is where collect.sh actually leaves it.
          path: testing/chainsaw/official-chart/support-bundle-*.tar.gz
          retention-days: 3
